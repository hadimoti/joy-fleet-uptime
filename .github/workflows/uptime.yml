# Synthetic uptime monitoring for a small set of public websites.
#
# It probes each site from a GitHub-hosted runner every 5 minutes and sends a
# Telegram message for non-green results.
#
# The one interesting idea here
# -----------------------------
# Most of these hostnames sit behind a CDN. One of them (the "origin" host)
# deliberately bypasses it and resolves straight to the web server. Watching
# both paths separately turns a single ambiguous "the sites are down" into two
# distinguishable conditions that need opposite responses:
#
#   CDN hosts failing + origin failing  -> the server itself is down
#   CDN hosts failing + origin healthy  -> a CDN/DNS/network-path problem;
#                                          the server is fine, leave it alone
#
# Without that second data point the two are indistinguishable, and you end up
# debugging a server that was never broken.
#
# The thing that bites every synthetic monitor
# --------------------------------------------
# CDN bot protection challenges datacenter IPs, and a CI runner is a datacenter
# IP. When that happens the CDN returns a 403 carrying an interstitial page
# ("Just a moment...") while the site is completely healthy for real users --
# the monitor is simply not allowed to look.
#
# Treating that as DOWN would misreport the host's state. A challenge is
# classified separately and never counted as UP or DOWN. Both CHALLENGED and
# ALL_CHALLENGED are successful inconclusive probe outcomes; they emit a GitHub
# warning and summary entry, without paging. To make those hosts genuinely
# measurable, add a CDN rule that skips bot protection for the monitored paths
# (/ready, /live).
#
# Why this repository is public
# -----------------------------
# GitHub Actions is free and unmetered on public repositories but metered on
# private ones. This workflow is intentionally isolated in a public repo so it
# can run continuously at no cost. It contains no private information: every
# hostname it probes is already resolvable in public DNS.
#
# Repository secrets (TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID) remain encrypted and
# are never exposed publicly. GitHub withholds secrets from workflows triggered
# by pull requests from forks, so a fork cannot exfiltrate them.

name: uptime

on:
  schedule:
    # Every 5 minutes. Free and unmetered because this repository is public.
    # GitHub's scheduled triggers are best-effort and can be delayed under
    # platform load, so treat this as very good monitoring, not a hard SLA.
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      drill:
        description: Send a labelled Telegram delivery test
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  # Do not cancel a running probe or its alert. GitHub keeps at most one pending
  # run in this group, replacing older pending runs if schedule triggers pile up.
  group: uptime-${{ github.event_name == 'workflow_dispatch' && inputs.drill && 'drill' || 'probe' }}
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    # Worst path: 12 targets x (2 x 15s curl + one 3s inter-attempt sleep) =
    # 396s, plus control 10s, alert 20s, and optional drill 20s = 446s (7m26s).
    # The probe step gets 8m; 18m for the job leaves 10m34s for checkout,
    # contract checks, step startup, and other runner overhead. The 5m schedule
    # can overlap in time; non-cancelling concurrency preserves active alerts.
    timeout-minutes: 18
    steps:
      - name: Check out workflow files
        uses: actions/checkout@v4
        timeout-minutes: 2

      - name: Classification contract
        shell: bash
        run: bash tests/uptime-classify.sh
        timeout-minutes: 2

      - name: Probe
        id: probe
        shell: bash
        timeout-minutes: 8
        run: |
          set -uo pipefail
          source .github/scripts/uptime-classify.sh

          CDN_HOSTS=(
            joyteam.ir
            www.joyteam.ir
            admin.joyteam.ir
            user.joyteam.ir
            music.joyteam.ir
            file.joyteam.ir
            joy.joyteam.ir
            joyst.ir
            shahantc.ir
            nutrized.ir
          )
          ORIGIN_HOST=direct.joyteam.ir
          # Readiness is probed on the origin host, NOT through the CDN, and
          # that is deliberate. The CDN zone challenges datacenter IPs, so a
          # probe sent through it returns an interstitial and tells us nothing
          # about application health. The origin host is DNS-only, so this
          # reaches the app directly and actually measures its dependencies.
          #
          # Residual gap, stated so nobody assumes otherwise: this does not
          # verify the CDN path for that zone. The other zones below still
          # answer normally and would reveal a broad CDN failure. To close the
          # gap fully, add a CDN rule that skips bot protection for /ready.
          READY_URL=https://direct.joyteam.ir/ready

          UA='uptime-probe/1.0'

          # Each attempt is UP (2xx/3xx without a challenge marker), CHALLENGED,
          # DOWN (unmarked 4xx/5xx), or UNREACHABLE (000 or invalid status).
          # Across at most two attempts, reduce in this order: any UP -> UP;
          # else any DOWN -> DOWN; else any UNREACHABLE -> UNREACHABLE; else
          # CHALLENGED. Stop immediately on UP.
          probe() {
            local url=$1 code body_file classification curl_exit attempt result i
            local -a attempt_states=() attempt_codes=()
            body_file=$(mktemp)
            for attempt in 1 2; do
              if code=$(curl -s -o "$body_file" -w '%{http_code}' \
                         --max-time 15 --connect-timeout 10 \
                         -A "$UA" "$url" 2>/dev/null); then
                curl_exit=0
              else
                curl_exit=$?
              fi
              classification=$(uptime_classify_file "$code" "$body_file" "$curl_exit")
              attempt_states+=("$classification")
              attempt_codes+=("${code:-}")
              if [ "$classification" = UP ]; then break; fi
              if [ "$attempt" -eq 1 ]; then sleep 3; fi
            done
            rm -f "$body_file"
            result=$(uptime_reduce_attempts "${attempt_states[@]}")
            if [ "$result" = UP ] || [ "$result" = DOWN ]; then
              for i in "${!attempt_states[@]}"; do
                if [ "${attempt_states[$i]}" = "$result" ]; then
                  echo "${attempt_codes[$i]}"
                  return 0
                fi
              done
            fi
            echo "$result"
          }

          down=()
          challenged=()
          unreachable=()
          cdn_codes=()
          for h in "${CDN_HOSTS[@]}"; do
            code=$(probe "https://${h}/") || true
            uptime_record_cdn_result "$h" "$code" down challenged unreachable
            cdn_codes+=("$code")
            printf '%-24s %s\n' "$h" "$code"
          done

          origin_code=$(probe "https://${ORIGIN_HOST}/") || true
          printf '%-24s %s\n' "$ORIGIN_HOST" "$origin_code"

          # The readiness endpoint reports whether the app's own dependencies
          # are healthy, which a plain homepage check cannot see: an app can
          # serve a perfectly good homepage while its database is unreachable.
          ready_code=$(probe "$READY_URL") || true
          printf '%-24s %s\n' 'ready' "$ready_code"

          n_chal=${#challenged[@]}
          n_total=${#CDN_HOSTS[@]}

          if [ "$n_chal" -gt 0 ]; then
            echo ""
            echo "NOTE: ${n_chal}/${n_total} host(s) served a CDN bot challenge:"
            echo "      ${challenged[*]}"
            echo "      Inconclusive, NOT counted as failures. To make these"
            echo "      measurable, add a CDN rule skipping bot protection for"
            echo "      the monitored paths."
            echo ""
          fi

          # First classify confirmed HTTP evidence alone. Only consult an
          # independent control host if treating transport failures as endpoint
          # failures would actually change the fleet verdict.
          verdict=$(uptime_verdict "$origin_code" "$ready_code" -1 000 "${cdn_codes[@]}")
          if [ "$verdict" = NEEDS_CONTROL ]; then
            # Do not use curl -f: any HTTP response (including 403/429) proves
            # the runner reached the public internet. Only connection failure
            # or HTTP 000 means PROBE_NETWORK when the verdict depends on it.
            if control_code=$(curl -s -o /dev/null -w '%{http_code}' \
                --max-time 10 --connect-timeout 5 \
                https://api.github.com/ 2>/dev/null); then
              control_exit=0
            else
              control_exit=$?
            fi
            control_code=${control_code:-000}
            printf '%-24s %s\n' 'api.github.com' "$control_code"
            verdict=$(uptime_verdict "$origin_code" "$ready_code" "$control_exit" "$control_code" "${cdn_codes[@]}")
          fi

          {
            echo "verdict=$verdict"
            echo "ready_code=$ready_code"
            echo "origin_code=$origin_code"
            echo "down_list=${down[*]:-none}"
            echo "challenged_list=${challenged[*]:-none}"
            echo "unreachable_list=${unreachable[*]:-none}"
            if uptime_should_alert "$verdict"; then
              echo "alert_required=true"
            else
              echo "alert_required=false"
            fi
          } >> "$GITHUB_OUTPUT"

          echo "VERDICT: $verdict"

          if [ "$verdict" = CHALLENGED ] || [ "$verdict" = ALL_CHALLENGED ]; then
            challenge_targets=("${challenged[@]}")
            [ "$origin_code" = CHALLENGED ] && challenge_targets+=("$ORIGIN_HOST")
            [ "$ready_code" = CHALLENGED ] && challenge_targets+=("direct.joyteam.ir/ready")
            challenge_targets_text=${challenge_targets[*]:-none}
            echo "::warning::CDN bot challenge; probe is inconclusive and will not page. Challenged hosts: $challenge_targets_text"
            {
              echo "### CDN challenge (inconclusive; no Telegram alert)"
              echo "Challenged hosts: $challenge_targets_text"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          # Challenges remain a distinct, non-paging outcome. Inconclusive
          # results without positive health evidence still fail and alert.
          case "$verdict" in
            OK|CHALLENGED|ALL_CHALLENGED) exit 0 ;;
            *) exit 1 ;;
          esac

      - name: Failure alert
        # A missing output means the probe crashed before deciding, so retain
        # the PROBE_CRASH alert fallback. The tested classifier decides known verdicts.
        if: always() && steps.probe.outputs.alert_required != 'false'
        shell: bash
        timeout-minutes: 2
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          VERDICT: ${{ steps.probe.outputs.verdict || 'PROBE_CRASH' }}
          DOWN_LIST: ${{ steps.probe.outputs.down_list }}
          CHALLENGED_LIST: ${{ steps.probe.outputs.challenged_list }}
          UNREACHABLE_LIST: ${{ steps.probe.outputs.unreachable_list }}
          READY_CODE: ${{ steps.probe.outputs.ready_code }}
          ORIGIN_CODE: ${{ steps.probe.outputs.origin_code }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -uo pipefail
          response_file=$(mktemp)
          trap 'rm -f "$response_file"' EXIT
          if [ -z "${BOT_TOKEN:-}" ] || [ -z "${CHAT_ID:-}" ]; then
            echo "::error::Telegram alert failed (required secrets are missing)"
            exit 1
          fi

          case "$VERDICT" in
            CDN_EDGE)
              headline="CDN edge failing - ORIGIN IS HEALTHY"
              advice="The origin answers directly. This is a CDN/DNS/network-path problem. Do not restart anything on the server." ;;
            ORIGIN_DOWN)
              headline="ORIGIN DOWN - real outage"
              advice="Both the CDN path and the direct origin path are failing. Investigate the server." ;;
            PARTIAL)
              headline="Partial outage"
              advice="Some hosts are failing while others serve normally. Check the listed hosts." ;;
            ORIGIN_ONLY_DOWN)
              headline="Origin host failure"
              advice="The origin host failed the probe. CDN host states are listed separately and do not change this origin result." ;;
            NOT_READY)
              headline="App reports NOT READY"
              advice="/ready reports a failed dependency. Check the app and review every listed failing host, including CDN paths." ;;
            PROBE_INCONCLUSIVE)
              headline="Probe inconclusive"
              advice="The probes produced no positive health evidence, or challenges coincided with connection failures. The health check is not green; inspect the probe paths." ;;
            *)
              headline="Probe failed ($VERDICT)"
              advice="See the workflow run." ;;
          esac

          text=$(printf '%s\n\ndown: %s\nchallenged: %s\nunreachable: %s\nready: %s\norigin: %s\n\n%s\n\n%s' \
            "$headline" "$DOWN_LIST" "$CHALLENGED_LIST" "$UNREACHABLE_LIST" "$READY_CODE" "$ORIGIN_CODE" "$advice" "$RUN_URL")

          if status=$(curl -s -o "$response_file" -w '%{http_code}' --max-time 20 \
            --data-urlencode "chat_id=${CHAT_ID}" \
            --data-urlencode "text=${text}" \
            --data-urlencode "disable_web_page_preview=true" \
            "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" 2>/dev/null); then
            curl_exit=0
          else
            curl_exit=$?
          fi
          ok=$(jq -r 'if .ok == true then "true" else "false" end' "$response_file" 2>/dev/null || echo false)
          printf 'Telegram HTTP status: %s; ok: %s\n' "${status:-000}" "$ok"
          if [ "$curl_exit" -ne 0 ] || [ "${status:-000}" != "200" ] || [ "$ok" != "true" ]; then
            echo "::error::Telegram alert delivery was not confirmed"
            exit 1
          fi

      - name: Telegram delivery drill
        if: always() && github.event_name == 'workflow_dispatch' && inputs.drill
        shell: bash
        timeout-minutes: 2
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          response_file=$(mktemp)
          trap 'rm -f "$response_file"' EXIT
          if [ -z "${BOT_TOKEN:-}" ] || [ -z "${CHAT_ID:-}" ]; then
            echo "::error::Telegram delivery drill failed (required secrets are missing)"
            exit 1
          fi

          timestamp=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          text=$(printf '[DRILL] Telegram delivery test\n\nThis is a test message.\nTimestamp: %s\nRun: %s' \
            "$timestamp" "$RUN_URL")
          if status=$(curl -s -o "$response_file" -w '%{http_code}' \
              --max-time 20 --connect-timeout 10 \
              --data-urlencode "chat_id=${CHAT_ID}" \
              --data-urlencode "text=${text}" \
              --data-urlencode "disable_web_page_preview=true" \
              "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" 2>/dev/null); then
            curl_exit=0
          else
            curl_exit=$?
          fi
          ok=$(jq -r 'if .ok == true then "true" else "false" end' "$response_file" 2>/dev/null || echo false)
          printf 'Telegram HTTP status: %s; ok: %s\n' "${status:-000}" "$ok"
          if [ "$curl_exit" -ne 0 ] || [ "${status:-000}" != "200" ] || [ "$ok" != "true" ]; then
            echo "::error::Telegram delivery drill was not confirmed"
            exit 1
          fi
